name: iPhone price monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Лише вивести в лог, нічого не надсилати в Telegram'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Restore state
        uses: actions/cache/restore@v5
        with:
          path: data
          key: price-state-${{ github.run_id }}
          restore-keys: price-state-
      - name: Run monitor
        run: node src/main.ts
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      - name: Save state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data
          key: price-state-${{ github.run_id }}-${{ github.run_attempt }}
